[project]
name = "udp-multicast-proxy"
version = "2.0.0"
description = "Share IPTV channels between many players: ffmpeg restreams each channel to UDP multicast and an HTTP proxy serves it to every viewer."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
udp-multicast-proxy = "udp_multicast_proxy.app:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not integration"]
markers = [
    "integration: end-to-end tests with real ffmpeg and multicast; run with `-m integration`",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "PL", "S", "C4", "RET", "PTH"]
ignore = [
    "PLR2004", # magic values are fine in tests and protocol constants
    "S104",    # binding to all interfaces is intentional: this is a LAN service
]

[tool.ruff.lint.pylint]
max-args = 8 # the wide signatures are keyword-only

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "PLR0913", "S310"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-requests>=2.33.0.20261006",
]
